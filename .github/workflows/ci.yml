name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Git Flow PR 방향 확인
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              printf '허용된 PR 방향: %s -> %s\n' "$HEAD_BRANCH" "$BASE_BRANCH"
              ;;
            *)
              printf '::error::허용되지 않은 PR 방향입니다. CONTRIBUTING.md의 브랜치 규칙을 확인하세요.\n'
              exit 1
              ;;
          esac

      - name: Java 21 및 Maven 캐시 준비
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            java/01-product-inventory/pom.xml
            spring/01-product-api/pom.xml

      - name: Gradle 캐시 및 Wrapper 검증 준비
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Java 상품·재고 실습 검증
        run: mvn --batch-mode --no-transfer-progress -f java/01-product-inventory/pom.xml verify

      - name: Spring 상품 API 실습 검증
        run: mvn --batch-mode --no-transfer-progress -f spring/01-product-api/pom.xml verify

      - name: GoldGuard 빌드 및 테스트
        working-directory: spring/02-goldguard
        run: ./gradlew --no-daemon --console=plain build
