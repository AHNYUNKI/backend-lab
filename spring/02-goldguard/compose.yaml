name: backend-lab-goldguard

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-goldguard}
      MYSQL_USER: ${DB_USERNAME:-goldguard}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 입력해 주세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env에 입력해 주세요}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-13307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

volumes:
  mysql-data:
